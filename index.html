<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Click</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --border: #d2d2d7;
      --line: #1d1d1f;
      --hover: rgba(0, 0, 0, .05);
      --active: #1d1d1f;
      --active-text: #ffffff;
      --shadow: 0 4px 24px rgba(0, 0, 0, .08), 0 1px 3px rgba(0, 0, 0, .04);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #000000;
        --surface: #161617;
        --text: #f5f5f7;
        --muted: #86868b;
        --border: #2d2d2f;
        --line: #f5f5f7;
        --hover: rgba(255, 255, 255, .08);
        --active: #f5f5f7;
        --active-text: #000000;
        --shadow: 0 4px 24px rgba(0, 0, 0, .5);
      }
    }
    :root[data-theme="dark"] {
      --bg: #000000;
      --surface: #161617;
      --text: #f5f5f7;
      --muted: #86868b;
      --border: #2d2d2f;
      --line: #f5f5f7;
      --hover: rgba(255, 255, 255, .08);
      --active: #f5f5f7;
      --active-text: #000000;
      --shadow: 0 4px 24px rgba(0, 0, 0, .5);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      transition: background-color .3s, color .3s;
    }


    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 999px;
      border: 1.5px solid var(--line);
      background: transparent;
      color: var(--text);
      font: inherit;
      font-weight: 500;
      letter-spacing: -0.01em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background-color .2s, color .2s, border-color .2s, transform .12s;
    }
    .pill:hover { background: var(--hover); }
    .pill:active { transform: scale(.96); }
    .pill:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

    .theme-btn {
      height: 40px; padding: 0 18px; font-size: 14px;
      border-color: var(--border);
      color: var(--muted);
      margin-top: 8px;
    }
    .theme-btn:hover { color: var(--text); border-color: var(--line); }
    .theme-btn svg { width: 18px; height: 18px; }
    .icon-moon { display: none; }
    [data-mode="dark"] .icon-sun { display: none; }
    [data-mode="dark"] .icon-moon { display: block; }

    main {
      flex: 1;
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    .stage {
      width: 100%;
      max-width: 540px;
      aspect-ratio: 1 / 1;
      background: var(--surface);
      border-radius: 36px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: background-color .3s, box-shadow .3s;
    }
    .stage canvas { width: 100%; height: 100%; display: block; }

    .label { font-size: 15px; color: var(--muted); }
    .label b { color: var(--text); font-weight: 600; }

    .states {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .state-btn { height: 56px; padding: 0 30px; font-size: 17px; }
    .state-btn[aria-pressed="true"],
    .state-btn[aria-pressed="true"]:hover {
      background: var(--active);
      border-color: var(--active);
      color: var(--active-text);
    }

    @media (max-width: 560px) {
      main { padding: 16px 16px 24px; gap: 20px; }
      .stage { border-radius: 28px; }
      .states {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        width: 100%;
      }
      .state-btn { width: 100%; height: 52px; padding: 0 12px; font-size: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="stage"><canvas id="rive"></canvas></div>
    <div class="label">State: <b id="current">idle</b></div>
    <div class="states">
      <button class="pill state-btn" data-state="idle" aria-pressed="true">Idle</button>
      <button class="pill state-btn" data-state="talk" aria-pressed="false">Talk</button>
      <button class="pill state-btn" data-state="lookHere" aria-pressed="false">Look here</button>
      <button class="pill state-btn" data-state="peekaboo" aria-pressed="false">Peekaboo</button>
      <button class="pill state-btn" data-state="cheer" aria-pressed="false">Cheer</button>
      <button class="pill state-btn" data-state="oops" aria-pressed="false">Oops</button>
    </div>
    <button class="pill theme-btn" id="themeBtn" type="button" aria-label="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span class="theme-text">Light</span>
    </button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@rive-app/canvas@2.39.2/rive.js"></script>
  <script>
    // Theme
    const root = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');
    const themeText = themeBtn.querySelector('.theme-text');
    const mq = window.matchMedia('(prefers-color-scheme: dark)');

    function savedTheme() {
      try { return localStorage.getItem('theme'); } catch (e) { return null; }
    }
    function applyTheme(theme) {
      const mode = theme || (mq.matches ? 'dark' : 'light');
      if (theme) root.setAttribute('data-theme', theme);
      root.setAttribute('data-mode', mode);
      themeText.textContent = mode === 'dark' ? 'Dark' : 'Light';
    }
    applyTheme(savedTheme());
    mq.addEventListener('change', () => { if (!savedTheme()) applyTheme(null); });
    themeBtn.addEventListener('click', () => {
      const next = root.getAttribute('data-mode') === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('theme', next); } catch (e) {}
      applyTheme(next);
    });

    // Rive
    const canvas = document.getElementById('rive');
    const current = document.getElementById('current');
    const buttons = document.querySelectorAll('.state-btn');
    let stateProp = null;

    const r = new rive.Rive({
      src: 'click.riv',
      canvas,
      artboard: 'Click',
      stateMachines: 'State Machine 1',
      autoplay: true,
      autoBind: true,
      layout: new rive.Layout({ fit: rive.Fit.Contain, alignment: rive.Alignment.Center }),
      onLoad: () => {
        r.resizeDrawingSurfaceToCanvas();
        const vmi = r.viewModelInstance;
        if (vmi) stateProp = vmi.enum('state');
        setState('idle');
      },
    });

    function setState(name) {
      if (stateProp) stateProp.value = name;
      current.textContent = name;
      buttons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.state === name)));
    }

    buttons.forEach(b => b.addEventListener('click', () => setState(b.dataset.state)));
    window.addEventListener('resize', () => r.resizeDrawingSurfaceToCanvas());
  </script>
</body>
</html>
